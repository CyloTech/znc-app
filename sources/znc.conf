// WARNING
//
// Do NOT edit this file while ZNC is running!
// Use webadmin or *controlpanel instead.
//
// Altering this file by hand will forfeit all support.
//
// But if you feel risky, you might want to read help on /znc saveconfig and /znc rehash.
// Also check http://en.znc.in/wiki/Configuration

Version = 1.8.2
<Listener l>
	Port = ZNCPORT
	IPv4 = true
	IPv6 = false
	SSL = true
</Listener>
LoadModule = webadmin
SSLCertFile = /etc/ssl/private/cert.pem
SSLKeyFile = /etc/ssl/private/key.pem
SSLDHParamFile = /znc-data/dh.pem

<User USER>
<Pass password>
        Method = sha256
        Hash = ZNCHASH
        Salt = ZNCSALT
</Pass>
	Admin      = true
	Nick       = USER
	AltNick    = USER_
	Ident      = USER
	RealName   = https://www.appboxes.co
	Buffer     = 50
	AutoClearChanBuffer = true
	ChanModes  = +stn
	LoadModule = webadmin
	LoadModule = controlpanel
</User>